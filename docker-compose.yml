# =============================================================================
# Smartfield — docker-compose
#
# Services:  smartfield (port 9988)  |  mqtt_subscriber (port 9987)  |  ui
# Network:   host — all containers share the host network stack directly.
#            This lets smartfield reach the drone over WiFi (192.168.42.1),
#            lets mqtt_subscriber reach the MQTT broker on the host, and
#            lets the UI reach both services at localhost.
#
# USAGE
#   docker compose up --build        # build and start all services
#   docker compose up smartfield     # start only smartfield
#   docker compose up ui             # start only the dashboard
#   docker compose down              # stop and remove containers
#
# UI DISPLAY (required before starting the ui service):
#   xhost +local:docker
# =============================================================================

services:

  # ── smartfield ──────────────────────────────────────────────────────────────
  smartfield:
    build:
      context: services/smartfield
      dockerfile: ${SMARTFIELD_DOCKERFILE:-Dockerfile.gpu}
    image: ${SMARTFIELD_IMAGE:-smartfield:gpu}
    container_name: smartfield
    network_mode: host
    environment:
      APP_PORT: "9988"
      MISSION_LOGS_DIR: /logs/mission
      CONFIG_PATH: /app/config.toml
    volumes:
      - ./logs/mission:/logs/mission
      - ./config.toml:/app/config.toml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9988/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── mqtt_subscriber ──────────────────────────────────────────────────────────
  mqtt_subscriber:
    build:
      context: services/mqtt_subscriber
      dockerfile: Dockerfile
    image: mqtt-subscriber:latest
    container_name: mqtt_subscriber
    network_mode: host
    environment:
      APP_PORT: "9987"
      MQTT_BROKER: "localhost"
      MQTT_PORT: "1883"
      SMARTFIELD_URL: "http://localhost:9988"
      CONFIG_PATH: "/app/config.toml"
    volumes:
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped
    depends_on:
      smartfield:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9987/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── ui ───────────────────────────────────────────────────────────────────────
  ui:
    build:
      context: services/ui
      dockerfile: Dockerfile
    image: smartfield-ui:latest
    container_name: smartfield_ui
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      SMARTFIELD_URL: "http://localhost:9988"
      SUBSCRIBER_URL: "http://localhost:9987"
      CONFIG_PATH: "/app/config.toml"
      LOGS_DIR: "/logs/mission"
      RTSP_URL: "rtsp://192.168.53.1/live"
    volumes:
      - ./config.toml:/app/config.toml
      - ./logs/mission:/logs/mission
      - /tmp/.X11-unix:/tmp/.X11-unix
    restart: "no"
    depends_on:
      smartfield:
        condition: service_healthy
